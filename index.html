<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منشئ السيرة الذاتية · CV Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var s=JSON.parse(localStorage.getItem("cvb:v1")||"{}").ui||{};document.documentElement.dataset.theme=s.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.lang=s.lang||"ar";document.documentElement.dir=(s.lang||"ar")=="ar"?"rtl":"ltr"}catch(e){}</script>
<style>
:root{--bg:#ECFEFF;--sf:#FFFFFF;--tx:#123047;--mu:#4d6a7c;--bd:#c6ebef;--ac:#0F766E;--ap:#fff;--er:#c0392b;--sh:0 4px 20px rgba(18,48,71,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a2234;--sf:#123047;--tx:#ECFEFF;--mu:#8fb5c4;--bd:#235069;--ac:#2DD4BF;--ap:#123047;--er:#ff7b6b;--sh:0 4px 20px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a2234;--sf:#123047;--tx:#ECFEFF;--mu:#8fb5c4;--bd:#235069;--ac:#2DD4BF;--ap:#123047;--er:#ff7b6b;--sh:0 4px 20px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Cairo,Tajawal,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hd{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;margin-inline-end:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);color:var(--ap);border-color:var(--ac)}.btn.s{padding:4px 8px}.btn[disabled]{opacity:.4;cursor:default}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.tabs{display:none;gap:8px;padding:8px 16px 0}.tabs .btn{flex:1;justify-content:center}.tabs .on{background:var(--ac);color:var(--ap)}
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
.st{flex:1;min-width:44px;border:0;background:none;cursor:pointer;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
.st b{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:12px}
.st.on{color:var(--tx)}.st.on b,.st.dn b{background:var(--ac);border-color:var(--ac);color:var(--ap)}
.bar{height:4px;background:var(--bd);border-radius:4px;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0F766E,#2DD4BF);border-radius:4px;transition:width .3s}
label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--mu)}
.in{width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
.in.bad{border-color:var(--er)}.em{color:var(--er);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.it{border:1px dashed var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:8px}
.chip{display:inline-block;padding:2px 9px;margin:2px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);font-size:12px;cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:20px;border:2px dashed var(--bd);border-radius:12px}
.score{font-size:34px;font-weight:700}.tip{font-size:13px;margin:4px 0;color:var(--mu)}.ok{color:#16a34a}
.mt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sw{width:24px;height:24px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 1px var(--bd);cursor:pointer}.sw.on{box-shadow:0 0 0 2px var(--tx)}
.pv{overflow:hidden}.pvw{display:flex;justify-content:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}.modal .card{width:min(560px,100%);max-height:85vh;overflow:auto}
/* resume (print-safe, independent of UI theme) */
#resume{width:210mm;min-height:297mm;background:#fff;color:#222;padding:12mm;font-size:10.5pt;line-height:1.5;box-shadow:var(--sh);zoom:var(--z,1);-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow-wrap:anywhere}
#resume h1{margin:0;font-size:24pt;line-height:1.2}#resume h2{font-size:10.5pt;margin:14px 0 6px;color:var(--a);text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--a);padding-bottom:2px}
#resume .x{margin-bottom:8px;break-inside:avoid}#resume .x b{display:block}#resume .m{color:#666;font-size:9.5pt}#resume p{margin:2px 0;white-space:pre-line}
#resume .sk span{display:inline-block;margin:2px 3px;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--a) 14%,#fff)}
#resume.classic header{text-align:center}#resume.classic h1{color:var(--a)}
#resume.minimal h2{border:0;color:#111;font-size:9.5pt;letter-spacing:.12em;margin-top:16px}#resume.minimal h1{font-weight:400}
#resume.modern{display:grid;grid-template-columns:33% 1fr;gap:0 7mm;background:linear-gradient(to var(--se),var(--a) 33%,#fff 33%);padding:0}
#resume.modern .sd{color:#fff;padding:12mm 6mm}#resume.modern .sd h2{color:#fff;border-color:#fff8}#resume.modern .sd .sk span{background:#ffffff26}#resume.modern .mn{padding:12mm 8mm 12mm 0}
#resume.creative{padding:0}#resume.creative .bn{background:var(--a);color:#fff;padding:12mm;display:flex;gap:12px;align-items:center}#resume.creative .cl{display:grid;grid-template-columns:1fr 34%;gap:8mm;padding:6mm 12mm 12mm}
.ph{width:26mm;height:26mm;border-radius:50%;object-fit:cover;display:block;margin-bottom:8px}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:8px}.tabs{display:flex}.app.v .ed,.app:not(.v) .pc{display:none}.g2{grid-template-columns:1fr}}
@media print{@page{size:A4;margin:12mm}.np{display:none!important}body{background:#fff}.app{display:block!important;padding:0}.app .pc,.app .pv{display:block!important;border:0;box-shadow:none;padding:0;background:none}#resume{zoom:1!important;box-shadow:none;padding:0;width:auto;min-height:0}#resume.modern .sd{padding:6mm}#resume.modern .mn{padding:6mm 4mm 6mm 0}#resume.creative .bn{padding:8mm}#resume.creative .cl{padding:4mm 0}}
</style>
</head>

function App(){const init=useRef(load()).current;const[list,setList]=useState(init.list),[cur,setCur]=useState(init.cur),[ui,setUi]=useState({lang:"ar",theme:document.documentElement.dataset.theme,...init.ui});
const[step,setStep]=useState(0),[tab,setTab]=useState(false),[modal,setModal]=useState(""),[msg,setMsg]=useState(""),[pages,setPages]=useState(1),[z,setZ]=useState(1),[jt,setJt]=useState("");
const t=T[ui.lang],r=list.find(x=>x.id==cur)||list[0],wr=useRef(),pr=useRef();
const[sm,setSm]=useState(undefined),[pb,setPb]=useState(false),[jd,setJd]=useState(""),[cvt,setCvt]=useState(""),[busy,setBusy]=useState(false),[err,setErr]=useState(""),[chg,setChg]=useState([]),[key,setKey]=useState(()=>{try{return localStorage.getItem("cvb:key")||""}catch(e){return ""}});
useEffect(()=>{let ok=1;(window.claude?claude.use("sample"):Promise.resolve(null)).then(s=>ok&&setSm(s||null),()=>ok&&setSm(null));return()=>{ok=0}},[]);
const saveKey=v=>{setKey(v);try{v?localStorage.setItem("cvb:key",v):localStorage.removeItem("cvb:key")}catch(e){}};
const dlPdf=async()=>{setPb(true);try{const blob=buildPDF(r).output("blob"),fn=((r.p.name||"cv").trim().replace(/[^\p{L}\p{N}]+/gu,"_")||"cv")+".pdf";
const dl=window.claude?await claude.use("downloads").catch(()=>null):null;
if(dl)await dl.save({filename:fn,data:blob});else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
}catch(e){if(!(e&&e.code=="declined"))flash(t.pdferr)}setPb(false)};
const tailor=async()=>{if(jd.trim().length<40)return setErr(t.e_short);setErr("");setBusy(true);
try{const src=cvt.trim()||JSON.stringify({p:r.p,summary:r.summary,exp:r.exp,edu:r.edu,skills:r.skills,proj:r.proj,langs:r.langs});
const txt=await callAI(buildPrompt(src,jd,r.rl,ui.lang),sm,key);const a=txt.indexOf("{"),b=txt.lastIndexOf("}");let o;
try{o=JSON.parse(txt.slice(a,b+1))}catch(e){throw{code:"parse"}}
const n=norm({...o,id:uid(),name:(ui.lang=="ar"?"مخصصة: ":"Tailored: ")+jd.trim().split("\n")[0].slice(0,40),rl:r.rl,tpl:r.tpl,ac:r.ac,font:r.font,photo:r.photo});
setList(l=>[...l,n]);setCur(n.id);setChg(Array.isArray(o.changes)?o.changes.map(String).slice(0,8):[]);setModal("done");
}catch(e){const c=e&&e.code;setErr(c=="parse"?t.e_parse:c=="nokey"?t.e_nokey:c=="badkey"?t.e_bad:c=="rate_limited"?t.e_rate:c=="not_granted"?t.e_denied:t.e_net)}
setBusy(false)};
const upd=p=>setList(l=>l.map(x=>x.id==r.id?{...x,...p}:x)),updP=p=>upd({p:{...r.p,...p}});
useEffect(()=>{save({list,cur,ui});const d=document.documentElement;d.lang=ui.lang;d.dir=ui.lang=="ar"?"rtl":"ltr";d.dataset.theme=ui.theme},[list,cur,ui]);
useEffect(()=>{const f=()=>{if(wr.current)setZ(Math.min(1,(wr.current.clientWidth-8)/794))};f();const o=new ResizeObserver(f);wr.current&&o.observe(wr.current);return()=>o.disconnect()},[tab]);
useEffect(()=>{const e=document.getElementById("resume");if(e)setPages(Math.max(1,Math.ceil((e.scrollHeight-4)/1123)))});
const flash=m=>{setMsg(m);setTimeout(()=>setMsg(""),1800)};
const res=ats(r,pages,t);
const addTxt=(k,i,v)=>{const x=r[k][i];upd({[k]:r[k].map((y,j)=>j==i?{...y,desc:(y.desc?y.desc.replace(/\s*$/,"")+"\n":"")+v+" "}:y)})};
const doCopy=async(s,m)=>{try{await navigator.clipboard.writeText(s);flash(m)}catch(e){flash("✗")}};
const importData=s=>{try{let d=JSON.parse(s),a=(Array.isArray(d)?d:d.list?d.list:[d]).map(norm);if(!a.length)throw 0;a.forEach(x=>x.id=uid());setList(l=>[...l,...a]);setCur(a[0].id);setModal("");flash("✓")}catch(e){flash(t.bad)}};
const dlJson=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,1)],{type:"application/json"}));a.download="cv.json";a.click()}catch(e){}};
const photoUp=e=>{const f=e.target.files[0];if(f)compress(f,d=>upd({photo:d}))};
const Y=(k,l,x={})=><Field l={l} v={r.p[k]} on={v=>updP({[k]:v})} {...x}/>;
const forms=[<>{<div className="row" style={{justifyContent:"flex-start",marginBottom:12}}>{r.photo&&<img className="ph" style={{margin:0}} src={r.photo} alt=""/>}<label className="btn"><input type="file" accept="image/*" hidden onChange={photoUp}/>{t.photo}</label>{r.photo&&<button className="btn" onClick={()=>upd({photo:""})}>{t.rmphoto}</button>}</div>}
{Y("name",t.name,{req:1})}{Y("title",t.jobt)}<div className="g2">{Y("email",t.email,{type:"email",vd:v=>/^\S+@\S+\.\S+$/.test(v),bad:"bad_email"})}{Y("phone",t.phone,{type:"tel",vd:v=>/^[+\d][\d\s\-()]{6,}$/.test(v),bad:"bad_phone"})}{Y("city",t.city)}{Y("link",t.link)}</div></>,
<Field l={t.summary} v={r.summary} on={v=>upd({summary:v})} multi rows={6}><span className="em" style={{color:r.summary.length>600?"var(--er)":"var(--mu)"}}>{t.sumh} ({r.summary.length})</span></Field>,
<List items={r.exp} set={v=>upd({exp:v})} blank={{role:"",co:"",period:"",desc:""}} addL={t.add} render={(e,s)=><><div className="g2"><Field l={t.role} v={e.role} on={v=>s({role:v})}/><Field l={t.co} v={e.co} on={v=>s({co:v})}/></div><Field l={t.period} v={e.period} on={v=>s({period:v})}/><Field l={t.desc} v={e.desc} on={v=>s({desc:v})} multi rows={4}/><Verbs rl={r.rl} add={v=>s({desc:(e.desc?e.desc.replace(/\s*$/,"")+"\n":"")+v+" "})}/></>}/>,
<List items={r.edu} set={v=>upd({edu:v})} blank={{deg:"",school:"",period:""}} addL={t.add} render={(e,s)=><><Field l={t.deg} v={e.deg} on={v=>s({deg:v})}/><div className="g2"><Field l={t.school} v={e.school} on={v=>s({school:v})}/><Field l={t.period} v={e.period} on={v=>s({period:v})}/></div></>}/>,
<Field l={t.skills} v={r.skills} on={v=>upd({skills:v})} multi rows={3}><span className="em" style={{color:"var(--mu)"}}>{t.skh} ({skl(r.skills).length})</span></Field>,
<List items={r.proj} set={v=>upd({proj:v})} blank={{name:"",link:"",desc:""}} addL={t.add} render={(e,s)=><><div className="g2"><Field l={t.pname} v={e.name} on={v=>s({name:v})}/><Field l={t.link} v={e.link} on={v=>s({link:v})}/></div><Field l={t.desc} v={e.desc} on={v=>s({desc:v})} multi rows={3}/></>}/>,
<Field l={t.langs} v={r.langs} on={v=>upd({langs:v})} multi rows={3}><span className="em" style={{color:"var(--mu)"}}>{t.langh}</span></Field>];
return<Ctx.Provider value={t}>
<header className="hd np"><div className="logo"><span style={{color:r.ac}}>■</span>{t.app}</div>
<button className="btn" onClick={()=>setModal("list")}><Ic n="files"/>{t.resumes}</button>
<button className="btn" onClick={()=>{setErr("");setModal("tl")}}>✦ {t.tailor}</button>
<button className="btn" onClick={()=>setModal("bk")}>{t.backup}</button>
<button className="btn" aria-label="Language" onClick={()=>setUi({...ui,lang:ui.lang=="ar"?"en":"ar"})}><Ic n="globe"/>{ui.lang=="ar"?"EN":"عربي"}</button>
<button className="btn" aria-label="Theme" onClick={()=>setUi({...ui,theme:ui.theme=="dark"?"light":"dark"})}><Ic n={ui.theme=="dark"?"sun":"moon"}/></button>
<button className="btn p" disabled={pb} title={t.atsn} onClick={dlPdf}><Ic n="print"/>{pb?"…":t.print}</button></header>
<div className="tabs np"><button className={"btn"+(!tab?" on":"")} onClick={()=>setTab(false)}>{t.edit}</button><button className={"btn"+(tab?" on":"")} onClick={()=>setTab(true)}>{t.view}</button></div>
<div className={"app"+(tab?" v":"")}>
<div className="ed np"><div className="card"><div className="steps" role="tablist">{t.steps.map((s,i)=><button key={i} role="tab" aria-selected={i==step} className={"st"+(i==step?" on":i<step?" dn":"")} onClick={()=>setStep(i)}><b>{i+1}</b>{s}</button>)}</div>
<div className="bar"><i style={{width:(step+1)/7*100+"%"}}/></div>{forms[step]}
<div className="row" style={{marginTop:12}}><button className="btn" disabled={!step} onClick={()=>setStep(step-1)}>{t.prev}</button><button className="btn p" disabled={step==6} onClick={()=>setStep(step+1)}>{t.next}</button></div></div>
<div className="card"><div className="row"><b>{t.ats}</b><span className="score" style={{color:res.total>=80?"#16a34a":res.total>=50?"#d97706":"var(--er)"}}>{res.total}<small style={{fontSize:14}}>/100</small></span></div>
{res.rules.map(x=><div key={x.k} className="tip"><span>{x.l}: {x.p}/{x.m}</span>{x.tip&&<div>↳ {x.tip}</div>}</div>)}
{res.total==100&&<div className="tip ok">{t.allok}</div>}<div className="tip">{t.pages}: {pages}</div></div>
<div className="tip">{t.warn}</div></div>
<div className="pc"><div className="card np"><div className="mt">{TPL.map((x,i)=><button key={x} className={"btn"+(r.tpl==x?" p":"")} onClick={()=>upd({tpl:x})}>{t.tpl[i]}</button>)}</div>
<div className="mt">{ACC.map(c=><button key={c} className={"sw"+(r.ac==c?" on":"")} style={{background:c}} aria-label={c} onClick={()=>upd({ac:c})}/>)}
<select className="in" style={{width:"auto",margin:0}} aria-label="Font" value={r.font} onChange={e=>upd({font:e.target.value})}>{FONTS.map(f=><option key={f}>{f}</option>)}</select>
<button className="btn" onClick={()=>upd({rl:r.rl=="ar"?"en":"ar"})}>{t.rl}: {r.rl.toUpperCase()}</button>
<button className="btn" onClick={()=>doCopy(plain(r),t.copied)}><Ic n="copy"/>{msg||t.copy}</button></div></div>
<div className="pv" ref={wr} style={{"--z":z}}><div className="pvw">{r.p.name||r.summary||r.exp.length?<Resume r={r} pages={pages}/>:<div className="empty np" style={{width:"100%"}}>{t.ph}</div>}</div></div></div></div>
{modal=="list"&&<Modal close={()=>setModal("")} title={t.resumes}>{list.map(x=><div className="row" key={x.id}><input className="in" style={{margin:0,borderColor:x.id==cur?"var(--ac)":""}} aria-label="name" value={x.name} placeholder={x.p.name||t.untitled} onFocus={()=>setCur(x.id)} onChange={e=>setList(l=>l.map(y=>y.id==x.id?{...y,name:e.target.value}:y))}/>
<button className="btn s" aria-label={t.dup} onClick={()=>{const c={...norm(x),id:uid(),name:(x.name||x.p.name)+" ✦"};setList([...list,c]);setCur(c.id)}}><Ic n="copy"/></button>
<button className="btn s" aria-label={t.del} disabled={list.length<2} onClick={()=>{const l=list.filter(y=>y.id!=x.id);setList(l);if(cur==x.id)setCur(l[0].id)}}><Ic n="trash"/></button></div>)}
<button className="btn p" onClick={()=>{const b=blank();setList([...list,b]);setCur(b.id);setStep(0);setModal("")}}><Ic n="plus"/>{t.newr}</button></Modal>}
{modal=="bk"&&<Modal close={()=>setModal("")} title={t.backup}><textarea className="in" rows={8} dir="ltr" value={jt||JSON.stringify(r)} onChange={e=>setJt(e.target.value)} aria-label="JSON"/>
<div className="mt" style={{marginTop:10}}><button className="btn" onClick={()=>doCopy(JSON.stringify(r),t.copied)}>{t.exportj}</button><button className="btn" onClick={dlJson}>{t.dl}</button><button className="btn p" onClick={()=>importData(jt)} disabled={!jt}>{t.imp}</button>
<label className="btn">{t.impf}<input type="file" accept=".json,application/json" hidden onChange={e=>{const f=e.target.files[0];if(f){const rd=new FileReader();rd.onload=()=>importData(String(rd.result));rd.readAsText(f)}}}/></label></div><div className="tip">{msg}</div></Modal>}
{modal=="tl"&&<Modal close={()=>!busy&&setModal("")} title={t.tailor}>
{sm===null&&<Field l={t.key} v={key} on={saveKey} type="password" ph="sk-ant-…"><span className="em" style={{color:"var(--mu)"}}>{t.keyh} {key&&<button className="chip" onClick={()=>saveKey("")}>{t.rmkey}</button>}</span></Field>}
<Field l={t.tjd} v={jd} on={setJd} multi rows={7}/>
<Field l={t.tcv} v={cvt} on={setCvt} multi rows={4}><span className="em" style={{color:"var(--mu)"}}>{t.tcvh}</span></Field>
{err&&<div className="em" role="alert" style={{marginBottom:8}}>{err}</div>}
<button className="btn p" disabled={busy} onClick={tailor}>{busy?t.tbusy:t.tgo}</button></Modal>}
{modal=="done"&&<Modal close={()=>setModal("")} title={t.tdone}>
{chg.length>0&&<><b>{t.tch}</b><ul>{chg.map((c,i)=><li key={i}>{c}</li>)}</ul></>}
<div className="tip">{t.tnote}</div>
<div className="mt" style={{marginTop:10}}><button className="btn p" onClick={()=>{setModal("");setTab(true);dlPdf()}}><Ic n="print"/>{t.print}</button><button className="btn" onClick={()=>{setModal("");setTab(true)}}>{t.view}</button></div></Modal>}
</Ctx.Provider>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
